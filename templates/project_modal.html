<dialog id="project-modal" class="project-dialog"><form method="post" action="/projects/create/" class="project-composer">{%csrf_token%}<header class="project-composer-head"><div class="project-crumb"><span>فضای شخصی</span><i>›</i><b>پروژه جدید</b></div><button type="button" class="project-close" onclick="this.closest('dialog').close()" aria-label="بستن">×</button></header><main class="project-composer-body"><input class="project-name-input" name="name" placeholder="نام پروژه" required autofocus><div class="project-summary-label">یک خلاصه کوتاه برای پروژه بنویسید…</div><div class="project-divider"></div><textarea name="description" placeholder="توضیحات، هدف پروژه یا ایده‌ها را اینجا بنویسید…"></textarea></main><footer class="project-composer-footer"><button type="button" class="project-cancel" onclick="this.closest('dialog').close()">انصراف</button><button class="project-create">ایجاد پروژه</button></footer></form></dialog>
