{% extends 'base.html' %}
{% block content %}
<section class="calendar-page calendar-drilldown">
  <div class="calendar-topbar"><div><span class="eyebrow">برنامه‌ریزی</span><h1>تقویم</h1></div><button onclick="document.querySelector('#event-modal').showModal()">+ رویداد جدید</button></div>
  <section class="excel-calendar">
    <div class="calendar-path" id="calendar-path"></div>
    <div class="calendar-sheet-head"><div><span id="sheet-kicker">لایه چهارم</span><h2 id="sheet-title">برنامه روز</h2></div><div class="sheet-controls"><button class="secondary" type="button" onclick="move(-1)" aria-label="قبلی">‹</button><button class="secondary" type="button" onclick="goToday()">امروز</button><button class="secondary" type="button" onclick="move(1)" aria-label="بعدی">›</button></div></div>
    <div id="calendar-sheet" class="calendar-sheet"></div>
  </section>
</section>
<dialog id="event-modal" class="event-dialog"><form id="event-form" class="modal event-modal"><div class="event-modal-head"><div><span class="eyebrow">تقویم</span><h2>رویداد جدید</h2></div><button type="button" class="event-close" onclick="this.closest('dialog').close()" aria-label="بستن"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div><label class="event-field"><span>عنوان رویداد</span><input name="title" placeholder="مثلاً جلسه هماهنگی تیم" required></label><div class="event-split"><label class="event-field"><span>فضای کار</span><input type="hidden" name="project" id="event-project" value=""><div class="custom-select" id="project-select"><button type="button" class="custom-select-trigger" onclick="toggleProjectMenu()"><b id="project-select-label">شخصی</b><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg></button><div class="custom-select-menu" id="project-select-menu" hidden><button type="button" class="selected" data-group="" onclick="setProject('', 'شخصی', this)">شخصی</button>{%for p in projects%}<button type="button" data-group="{{p.group_id|default:''}}" onclick="setProject('{{p.id}}', '{{p.name|escapejs}}', this)">{{p.name}}</button>{%endfor%}</div></div></label><label class="event-field event-type-field"><span>نوع</span><input name="type" list="event-types" placeholder="جلسه یا زحمت" value="جلسه" required><datalist id="event-types"><option value="جلسه"><option value="زحمت"></datalist></label></div><input name="start" id="event-start" type="hidden" required><div id="meeting-schedule" class="schedule-extra"><label class="event-field"><span>مدت جلسه</span><select id="meeting-duration"><option value="30">۳۰ دقیقه</option><option value="60" selected>۱ ساعت</option><option value="90">۱ ساعت و ۳۰ دقیقه</option><option value="120">۲ ساعت</option></select></label></div><div id="task-schedule" class="schedule-extra" hidden><label class="event-field"><span>زمان پایان / ددلاین</span><input id="event-end-time" type="time" value="10:00"></label></div><div class="event-date-split"><label class="event-field"><span>ساعت</span><input id="event-time" type="hidden" value="09:00" required><button type="button" class="time-input" id="open-time-picker"><b id="selected-time-label">۰۹:۰۰</b><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3.5 2"></path></svg></button></label><label class="event-field"><span>تاریخ</span><div class="persian-date-input"><input id="event-persian-date" type="text" inputmode="numeric" placeholder="1404/03/11" required><button type="button" id="open-date-picker" aria-label="انتخاب تاریخ"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4m8-4v4M3 10h18"></path></svg></button></div></label></div><section id="jalali-picker" class="jalali-picker" hidden></section><section id="clock-picker" class="clock-picker" hidden></section><label class="notify-row"><input type="checkbox" name="notify"><span class="check-art"></span><span>ارسال یادآوری در تلگرام</span></label><button class="event-submit">ذخیره رویداد</button></form></dialog>
{% endblock %}
{% block scripts %}<script src="/static/js/calendar.js"></script>{%endblock %}
