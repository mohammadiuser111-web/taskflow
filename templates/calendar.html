{% extends 'base.html' %}
{% block content %}
<section class="calendar-page calendar-drilldown">
  <div class="calendar-topbar"><div><span class="eyebrow">برنامه‌ریزی</span><h1>تقویم</h1></div><button onclick="document.querySelector('#event-modal').showModal()">+ رویداد جدید</button></div>
  <section class="excel-calendar">
    <div class="calendar-path" id="calendar-path"></div>
    <div class="calendar-sheet-head"><div><span id="sheet-kicker">لایه چهارم</span><h2 id="sheet-title">برنامه روز</h2></div><div class="sheet-controls"><button class="secondary" type="button" onclick="move(-1)" aria-label="قبلی">‹</button><button class="secondary" type="button" onclick="goToday()">امروز</button><button class="secondary" type="button" onclick="move(1)" aria-label="بعدی">›</button></div></div>
    <div id="calendar-sheet" class="calendar-sheet"></div>
  </section>
</section>
<dialog id="event-modal" class="event-dialog"><form id="event-form" class="modal event-modal"><div class="event-modal-head"><div><span class="eyebrow">تقویم</span><h2>رویداد جدید</h2></div><button type="button" class="event-close" onclick="this.closest('dialog').close()" aria-label="بستن"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div><label class="event-field"><span>عنوان رویداد</span><input name="title" placeholder="مثلاً جلسه هماهنگی تیم" required></label><div class="event-split"><label class="event-field"><span>فضای کار</span><select name="project"><option value="">شخصی</option>{%for p in projects%}<option value="{{p.id}}">{{p.name}}</option>{%endfor%}</select></label><label class="event-field"><span>نوع</span><select name="type"><option value="meeting">جلسه</option><option value="event">رویداد</option></select></label></div><input name="start" id="event-start" type="hidden" required><div class="event-date-split"><label class="event-field"><span>ساعت</span><div class="time-input"><input id="event-time" type="time" value="09:00" required><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3.5 2"></path></svg></div></label><label class="event-field"><span>تاریخ</span><div class="persian-date-input"><input id="event-persian-date" type="text" inputmode="numeric" placeholder="1404/03/11" required><button type="button" id="open-date-picker" aria-label="انتخاب تاریخ"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4m8-4v4M3 10h18"></path></svg></button></div></label></div><section id="jalali-picker" class="jalali-picker" hidden></section><label class="notify-row"><input type="checkbox" name="notify"><span class="check-art"></span><span>ارسال یادآوری در تلگرام</span></label><button class="event-submit">ذخیره رویداد</button></form></dialog>
{% endblock %}
{% block scripts %}<script src="/static/js/calendar.js"></script>{%endblock %}
