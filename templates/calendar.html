{% extends 'base.html' %}
{% block content %}
<section class="calendar-page calendar-drilldown">
  <div class="calendar-topbar"><div><span class="eyebrow">برنامه‌ریزی</span><h1>تقویم</h1></div><button onclick="document.querySelector('#event-modal').showModal()">+ رویداد جدید</button></div>
  <section class="excel-calendar">
    <div class="calendar-path" id="calendar-path"></div>
    <div class="calendar-sheet-head"><div><span id="sheet-kicker">لایه چهارم</span><h2 id="sheet-title">برنامه روز</h2></div><div class="sheet-controls"><button class="secondary" type="button" onclick="move(-1)" aria-label="قبلی">‹</button><button class="secondary" type="button" onclick="goToday()">امروز</button><button class="secondary" type="button" onclick="move(1)" aria-label="بعدی">›</button></div></div>
    <div id="calendar-sheet" class="calendar-sheet"></div>
  </section>
</section>
<dialog id="event-modal"><form id="event-form" class="modal"><div class="title"><h2>رویداد جدید</h2><button type="button" class="secondary" onclick="this.closest('dialog').close()">×</button></div><input name="title" placeholder="عنوان رویداد" required><select name="project"><option value="">شخصی</option>{%for p in projects%}<option value="{{p.id}}">{{p.name}}</option>{%endfor%}</select><select name="type"><option value="meeting">جلسه</option><option value="event">رویداد</option></select><input name="start" type="datetime-local" required><label><input type="checkbox" name="notify"> اطلاع تلگرام</label><button>ذخیره رویداد</button></form></dialog>
{% endblock %}
{% block scripts %}<script src="/static/js/calendar.js"></script>{%endblock %}
