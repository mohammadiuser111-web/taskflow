{% extends 'base.html' %}{% block content %}<div class="title"><h1>تقویم</h1><button onclick="document.querySelector('#event-modal').showModal()">+ رویداد</button></div><div class="calendar-nav"><button onclick="shift(-1)">ماه قبل</button><b id="month-title"></b><button onclick="shift(1)">ماه بعد</button></div><div id="calendar-grid" class="calendar-grid"></div><dialog id="event-modal"><form id="event-form" class="modal"><h2>رویداد جدید</h2><input name="title" placeholder="عنوان" required><select name="project"><option value="">شخصی</option>{%for p in projects%}<option value="{{p.id}}">{{p.name}}</option>{%endfor%}</select><select name="type"><option value="meeting">جلسه</option><option value="event">رویداد</option></select><input name="start" type="datetime-local" required><label><input type="checkbox" name="notify"> اطلاع تلگرام</label><button>ذخیره</button></form></dialog>{% endblock %}{% block scripts %}<script src="/static/js/calendar.js"></script>{%endblock%}
