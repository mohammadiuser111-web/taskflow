<dialog id="task-modal" class="event-dialog task-dialog"><form id="task-form" class="modal event-modal task-modal"><div class="event-modal-head"><div><span class="eyebrow">MOHAMMADI Tasks</span><h2>وظیفه جدید</h2></div><button type="button" class="event-close" onclick="this.closest('dialog').close()" aria-label="بستن"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div><label class="event-field"><span>عنوان وظیفه</span><input name="title" placeholder="مثلاً طراحی صفحه اصلی" required></label><label class="event-field"><span>توضیحات</span><textarea name="description" placeholder="توضیحات تکمیلی وظیفه…"></textarea></label><input type="hidden" name="project" value="{% if project %}{{project.id}}{% endif %}"><input type="hidden" name="type" value="normal"><input type="hidden" name="due"><div class="task-due-split"><label class="event-field"><span>تاریخ مهلت تحویل</span><div class="task-date-control"><input id="task-due-date" type="date"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4m8-4v4M3 10h18"></path></svg></div></label><label class="event-field"><span>ساعت مهلت تحویل</span><div class="task-time-control"><input id="task-due-time" type="time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3.5 2"></path></svg></div></label></div><div class="event-field subtask-builder"><span>زیرکارها</span><div id="subtask-rows"></div><button type="button" class="add-subtask" onclick="addSubtaskRow()">+ افزودن زیرکار</button></div><button class="event-submit">ایجاد وظیفه</button></form></dialog>
<script>
function addSubtaskRow(value=''){let row=document.createElement('div');row.className='subtask-row';row.innerHTML=`<input class="subtask-input" placeholder="عنوان زیرکار" value="${value}"><button type="button" title="حذف زیرکار" onclick="this.parentElement.remove()"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M9 7l1-2h4l1 2m-9 0 1 13h10l1-13"></path></svg></button>`;document.querySelector('#subtask-rows').append(row)}
function toggleMenu(id){let m=document.querySelector(id);m.hidden=!m.hidden}function toggleTaskProjectMenu(){toggleMenu('#task-project-menu')}function toggleTaskTypeMenu(){toggleMenu('#task-type-menu')}function setTaskProject(v,l,b){document.querySelector('#task-project').value=v;document.querySelector('#task-project-label').textContent=l;document.querySelectorAll('#task-project-menu button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#task-project-menu').hidden=true}function setTaskType(v,l,b){document.querySelector('#task-type').value=v;document.querySelector('#task-type-label').textContent=l;document.querySelectorAll('#task-type-menu button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#task-type-menu').hidden=true}document.addEventListener('click',e=>{for(let id of ['#task-project-select','#task-type-select']){let w=document.querySelector(id);if(w&&!w.contains(e.target))w.querySelector('.custom-select-menu').hidden=true}});document.querySelector('#task-form')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target;let dueDate=document.querySelector('#task-due-date').value,dueTime=document.querySelector('#task-due-time').value;f.due.value=dueDate?(dueDate+'T'+(dueTime||'23:59')):'';let x=await api('/api/tasks/create/',{title:f.title.value,description:f.description.value,project_id:f.project.value||null,due_date:f.due.value||null,tags:[],subtasks:[...document.querySelectorAll('.subtask-input')].map(x=>x.value.trim()).filter(Boolean),task_type:f.type.value,x:window.taskCreatePosition?.x,y:window.taskCreatePosition?.y});if(x.ok)location.reload()})
</script>
