<dialog id="task-modal" class="project-dialog task-composer-dialog"><form id="task-form" class="project-composer task-composer"><input type="hidden" name="project" value="{% if project %}{{project.id}}{% endif %}"><input type="hidden" name="type" value="normal"><input type="hidden" name="task_list" id="task-list-id"><input type="hidden" name="due"><header class="project-composer-head"><div class="project-crumb"><span>فضای شخصی</span><i>›</i><b>کار جدید</b></div><button type="button" class="project-close" onclick="this.closest('dialog').close()">×</button></header><main class="project-composer-body"><input class="project-name-input" name="title" placeholder="عنوان کار" required autofocus><input class="project-summary-input" name="description" placeholder="توضیح کوتاه درباره کار…"><div class="project-divider"></div><div class="event-date-split task-due-split"><label class="event-field"><span>ساعت مهلت تحویل</span><input id="task-due-time" type="hidden"><button type="button" class="time-input" id="open-task-time-picker"><b id="task-time-label">انتخاب ساعت</b><i data-lucide="clock-3"></i></button></label><label class="event-field"><span>تاریخ مهلت تحویل</span><input id="task-due-date" type="hidden"><div class="persian-date-input"><input id="task-date-label" type="text" readonly placeholder="انتخاب تاریخ"><button type="button" id="open-task-date-picker"><i data-lucide="calendar-days"></i></button></div></label></div><section id="task-jalali-picker" class="jalali-picker" hidden></section><section id="task-clock-picker" class="clock-picker" hidden></section><div class="event-field subtask-builder"><span>زیرکارها</span><div id="subtask-rows"></div><button type="button" class="add-subtask" onclick="addSubtaskRow()">+ افزودن زیرکار</button></div></main><footer class="project-composer-footer"><button type="button" class="project-cancel" onclick="this.closest('dialog').close()">انصراف</button><button class="project-create">ایجاد کار</button></footer></form></dialog><script>function addSubtaskRow(value=''){let row=document.createElement('div');row.className='subtask-row';row.innerHTML=`<input class="subtask-input" placeholder="عنوان زیرکار" value="${value}"><button type="button" title="حذف زیرکار" onclick="this.parentElement.remove()"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M9 7l1-2h4l1 2m-9 0 1 13h10l1-13"></path></svg></button>`;document.querySelector('#subtask-rows').append(row)}let tpYear=1405,tpMonth=1,tpDate='',tpHour=9,tpMin=0;const pms=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];const pd=n=>String(n).replace(/[0-9]/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]);function taskPicker(){let b=document.querySelector('#task-jalali-picker');let years=Array.from({length:12},(_,i)=>tpYear-5+i).map(y=>`<button type="button" onclick="chooseTaskYear(${y})">${pd(y)}</button>`).join('');b.innerHTML=`<div class="picker-path"><button class="active">سال ${pd(tpYear)}</button></div><div class="picker-grid picker-years">${years}</div>`;b.hidden=false;document.querySelector('#task-clock-picker').hidden=true}function taskMonths(){let b=document.querySelector('#task-jalali-picker');b.innerHTML=`<div class="picker-path"><button onclick="taskPicker()">سال ${pd(tpYear)}</button><i>‹</i><button class="active">ماه</button></div><div class="picker-grid picker-months">${pms.map((m,i)=>`<button type="button" onclick="chooseTaskMonth(${i+1})"><small>${pd(i+1)}</small>${m}</button>`).join('')}</div>`}function taskDays(){let b=document.querySelector('#task-jalali-picker');b.innerHTML=`<div class="picker-path"><button class="active">روز</button></div><div class="picker-grid picker-days">${Array.from({length:31},(_,i)=>`<button type="button" onclick="chooseTaskDay(${i+1})"><b>${pd(i+1)}</b><small>${taskWeekday(i+1)}</small></button>`).join('')}</div>`}window.chooseTaskYear=function(y){tpYear=y;taskMonths()};window.chooseTaskMonth=function(m){tpMonth=m;taskDays()};window.chooseTaskDay=function(d){setTaskDate(d)};function taskWeekday(d){let g=new Date(tpYear+621,2,15);for(let i=0;i<410;i++){let q=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(g),o={};q.forEach(x=>{if(['year','month','day'].includes(x.type))o[x.type]=+x.value});if(o.year===tpYear&&o.month===tpMonth&&o.day===d)break;g.setDate(g.getDate()+1)}return new Intl.DateTimeFormat('fa-IR',{weekday:'long'}).format(g)}function setTaskDate(d){tpDate=`${tpYear}/${String(tpMonth).padStart(2,'0')}/${String(d).padStart(2,'0')}`;let g=new Date(tpYear+621,2,15);for(let i=0;i<410;i++){let q=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(g),o={};q.forEach(x=>{if(['year','month','day'].includes(x.type))o[x.type]=+x.value});if(o.year===tpYear&&o.month===tpMonth&&o.day===d)break;g.setDate(g.getDate()+1)}document.querySelector('#task-due-date').value=`${g.getFullYear()}-${String(g.getMonth()+1).padStart(2,'0')}-${String(g.getDate()).padStart(2,'0')}`;document.querySelector('#task-date-label').value=tpDate;document.querySelector('#task-jalali-picker').hidden=true}let taskHour=9,taskMinute=0,taskClockMode='hour';function renderTaskClock(){let b=document.querySelector('#task-clock-picker'),pm=taskHour>=12,shown=taskHour%12||12,vals=taskClockMode==='hour'?Array.from({length:12},(_,i)=>i+1):Array.from({length:12},(_,i)=>i*5),active=taskClockMode==='hour'?shown:taskMinute,angle=taskClockMode==='hour'?shown*30:taskMinute*6;let nums=vals.map((v,i)=>`<button type="button" class="clock-number ${v===active?'selected':''}" style="--i:${taskClockMode==='hour'?(i+1)%12:i}" onclick="${taskClockMode==='hour'?'pickTaskHour':'pickTaskMinute'}(${v})">${pd(v).padStart(2,'۰')}</button>`).join('');b.innerHTML=`<div class="analog-head"><span>انتخاب زمان</span><div class="analog-digits"><button type="button" class="${taskClockMode==='hour'?'active':''}" onclick="taskClockMode='hour';renderTaskClock()">${pd(shown).padStart(2,'۰')}</button><i>:</i><button type="button" class="${taskClockMode==='minute'?'active':''}" onclick="taskClockMode='minute';renderTaskClock()">${pd(taskMinute).padStart(2,'۰')}</button><div class="period-toggle"><button type="button" class="${!pm?'active':''}" onclick="setTaskPeriod(false)">صبح تا ظهر</button><button type="button" class="${pm?'active':''}" onclick="setTaskPeriod(true)">ظهر تا شب</button></div></div></div><div class="analog-clock"><div class="clock-face"><span class="clock-hand" style="transform:translateX(-50%) rotate(${angle}deg)"></span><i class="clock-center"></i>${nums}</div></div><div class="clock-actions"><button type="button" class="action-cancel" onclick="document.querySelector('#task-clock-picker').hidden=true">انصراف</button><button type="button" class="action-success" onclick="confirmTaskClock()">تأیید</button></div>`;b.hidden=false;document.querySelector('#task-jalali-picker').hidden=true}function taskClock(){taskClockMode='hour';renderTaskClock()}function pickTaskHour(v){taskHour=(v%12)+(taskHour>=12?12:0);renderTaskClock()}function pickTaskMinute(v){taskMinute=v;renderTaskClock()}function setTaskPeriod(pm){taskHour=(taskHour%12)+(pm?12:0);renderTaskClock()}function confirmTaskClock(){document.querySelector('#task-due-time').value=String(taskHour).padStart(2,'0')+':'+String(taskMinute).padStart(2,'0');document.querySelector('#task-time-label').textContent=pd(taskHour).padStart(2,'۰')+':'+pd(taskMinute).padStart(2,'۰');document.querySelector('#task-clock-picker').hidden=true}document.querySelector('#open-task-date-picker').onclick=taskPicker;document.querySelector('#open-task-time-picker').onclick=taskClock;document.querySelector('#task-form')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,dueDate=document.querySelector('#task-due-date').value,dueTime=document.querySelector('#task-due-time').value;f.due.value=dueDate?(dueDate+'T'+(dueTime||'23:59')):'';let x=await api('/api/tasks/create/',{title:f.title.value,description:f.description.value,project_id:f.project.value||null,task_list_id:f.task_list.value||null,due_date:f.due.value||null,tags:[],subtasks:[...document.querySelectorAll('.subtask-input')].map(x=>x.value.trim()).filter(Boolean),task_type:f.type.value,x:window.taskCreatePosition?.x,y:window.taskCreatePosition?.y});if(x.ok)location.reload()})</script>
