<dialog id="task-modal" class="event-dialog task-dialog"><form id="task-form" class="modal event-modal task-modal"><div class="event-modal-head"><div><span class="eyebrow">MOHAMMADI Tasks</span><h2>وظیفه جدید</h2></div><button type="button" class="event-close" onclick="this.closest('dialog').close()" aria-label="بستن"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div><label class="event-field"><span>عنوان وظیفه</span><input name="title" placeholder="مثلاً طراحی صفحه اصلی" required></label><label class="event-field"><span>توضیحات</span><textarea name="description" placeholder="توضیحات تکمیلی وظیفه…"></textarea></label><label class="event-field"><span>پروژه / شخصی</span><input type="hidden" name="project" id="task-project" value=""><div class="custom-select" id="task-project-select"><button type="button" class="custom-select-trigger" onclick="toggleTaskProjectMenu()"><b id="task-project-label">شخصی</b><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg></button><div class="custom-select-menu" id="task-project-menu" hidden><button type="button" class="selected" onclick="setTaskProject('', 'شخصی', this)">شخصی</button>{% for p in projects %}<button type="button" onclick="setTaskProject('{{p.id}}', '{{p.name|escapejs}}', this)">{{p.name}}</button>{% endfor %}</div></div></label><div class="event-date-split"><label class="event-field"><span>سررسید</span><input type="datetime-local" name="due"></label><label class="event-field"><span>نوع وظیفه</span><input type="hidden" name="type" id="task-type" value="normal"><div class="custom-select" id="task-type-select"><button type="button" class="custom-select-trigger" onclick="toggleTaskTypeMenu()"><b id="task-type-label">وظیفه عادی</b><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg></button><div class="custom-select-menu" id="task-type-menu" hidden><button type="button" class="selected" onclick="setTaskType('normal','وظیفه عادی',this)">وظیفه عادی</button><button type="button" onclick="setTaskType('goal','گره هدف',this)">گره هدف</button></div></div></label></div><label class="notify-row"><input type="checkbox" name="reminder"><span class="check-art"></span><span>ارسال یادآوری پیش از سررسید</span></label><div class="event-split"><label class="event-field"><span>برچسب‌ها</span><input name="tags" placeholder="مثلاً طراحی، فرانت‌اند"></label><label class="event-field"><span>زیرکارها</span><input name="subtasks" placeholder="با کاما جدا کنید"></label></div><button class="event-submit">ایجاد وظیفه</button></form></dialog>
<script>
function toggleMenu(id){let m=document.querySelector(id);m.hidden=!m.hidden}function toggleTaskProjectMenu(){toggleMenu('#task-project-menu')}function toggleTaskTypeMenu(){toggleMenu('#task-type-menu')}function setTaskProject(v,l,b){document.querySelector('#task-project').value=v;document.querySelector('#task-project-label').textContent=l;document.querySelectorAll('#task-project-menu button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#task-project-menu').hidden=true}function setTaskType(v,l,b){document.querySelector('#task-type').value=v;document.querySelector('#task-type-label').textContent=l;document.querySelectorAll('#task-type-menu button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#task-type-menu').hidden=true}document.addEventListener('click',e=>{for(let id of ['#task-project-select','#task-type-select']){let w=document.querySelector(id);if(w&&!w.contains(e.target))w.querySelector('.custom-select-menu').hidden=true}});document.querySelector('#task-form')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target;let x=await api('/api/tasks/create/',{title:f.title.value,description:f.description.value,project_id:f.project.value||null,due_date:f.due.value||null,reminder_enabled:f.reminder.checked,tags:f.tags.value.split(',').map(x=>x.trim()).filter(Boolean),subtasks:f.subtasks.value.split(',').map(x=>x.trim()).filter(Boolean),task_type:f.type.value,x:window.taskCreatePosition?.x,y:window.taskCreatePosition?.y});if(x.ok)location.reload()})
</script>
