<dialog id="task-modal" class="event-dialog task-dialog"><form id="task-form" class="modal event-modal task-modal"><div class="event-modal-head"><div><span class="eyebrow">MOHAMMADI Tasks</span><h2>وظیفه جدید</h2></div><button type="button" class="event-close" onclick="this.closest('dialog').close()" aria-label="بستن"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div><label class="event-field"><span>عنوان وظیفه</span><input name="title" placeholder="مثلاً طراحی صفحه اصلی" required></label><label class="event-field"><span>توضیحات</span><textarea name="description" placeholder="توضیحات تکمیلی وظیفه…"></textarea></label><input type="hidden" name="project" value="{% if project %}{{project.id}}{% endif %}"><input type="hidden" name="type" value="normal"><div class="event-date-split"><label class="event-field"><span>سررسید</span><input type="datetime-local" name="due"></label></div><label class="notify-row"><input type="checkbox" name="reminder"><span class="check-art"></span><span>ارسال یادآوری پیش از سررسید</span></label><div class="event-field subtask-builder"><span>زیرکارها</span><div id="subtask-rows"></div><button type="button" class="add-subtask" onclick="addSubtaskRow()">+ افزودن زیرکار</button></div><button class="event-submit">ایجاد وظیفه</button></form></dialog>
<script>
function addSubtaskRow(value=''){let row=document.createElement('div');row.className='subtask-row';row.innerHTML=`<input class="subtask-input" placeholder="عنوان زیرکار" value="${value}"><button type="button" title="حذف زیرکار" onclick="this.parentElement.remove()"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M9 7l1-2h4l1 2m-9 0 1 13h10l1-13"></path></svg></button>`;document.querySelector('#subtask-rows').append(row)}
function toggleMenu(id){let m=document.querySelector(id);m.hidden=!m.hidden}function toggleTaskProjectMenu(){toggleMenu('#task-project-menu')}function toggleTaskTypeMenu(){toggleMenu('#task-type-menu')}function setTaskProject(v,l,b){document.querySelector('#task-project').value=v;document.querySelector('#task-project-label').textContent=l;document.querySelectorAll('#task-project-menu button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#task-project-menu').hidden=true}function setTaskType(v,l,b){document.querySelector('#task-type').value=v;document.querySelector('#task-type-label').textContent=l;document.querySelectorAll('#task-type-menu button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#task-type-menu').hidden=true}document.addEventListener('click',e=>{for(let id of ['#task-project-select','#task-type-select']){let w=document.querySelector(id);if(w&&!w.contains(e.target))w.querySelector('.custom-select-menu').hidden=true}});document.querySelector('#task-form')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target;let x=await api('/api/tasks/create/',{title:f.title.value,description:f.description.value,project_id:f.project.value||null,due_date:f.due.value||null,reminder_enabled:f.reminder.checked,tags:[],subtasks:[...document.querySelectorAll('.subtask-input')].map(x=>x.value.trim()).filter(Boolean),task_type:f.type.value,x:window.taskCreatePosition?.x,y:window.taskCreatePosition?.y});if(x.ok)location.reload()})
</script>
