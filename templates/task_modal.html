<dialog id="task-modal" class="project-dialog task-composer-dialog"><form id="task-form" class="project-composer task-composer"><input type="hidden" name="project" value="{% if project %}{{project.id}}{% endif %}"><input type="hidden" name="type" value="normal"><input type="hidden" name="due"><header class="project-composer-head"><div class="project-crumb"><span>فضای شخصی</span><i>›</i><b>کار جدید</b></div><button type="button" class="project-close" onclick="this.closest('dialog').close()">×</button></header><main class="project-composer-body"><input class="project-name-input" name="title" placeholder="عنوان کار" required autofocus><input class="project-summary-input" name="description" placeholder="توضیح کوتاه درباره کار…"><div class="project-divider"></div><div class="task-due-split"><label class="event-field"><span>تاریخ مهلت تحویل</span><div class="task-date-control"><input id="task-due-date" type="hidden"><b id="task-date-label">انتخاب تاریخ</b><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4m8-4v4M3 10h18"></path></svg></div></label><label class="event-field"><span>ساعت مهلت تحویل</span><div class="task-time-control"><input id="task-due-time" type="hidden"><b id="task-time-label">انتخاب ساعت</b><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3.5 2"></path></svg></div></label></div><section id="task-jalali-picker" class="jalali-picker" hidden></section><section id="task-clock-picker" class="clock-picker" hidden></section><div class="event-field subtask-builder"><span>زیرکارها</span><div id="subtask-rows"></div><button type="button" class="add-subtask" onclick="addSubtaskRow()">+ افزودن زیرکار</button></div></main><footer class="project-composer-footer"><button type="button" class="project-cancel" onclick="this.closest('dialog').close()">انصراف</button><button class="project-create">ایجاد کار</button></footer></form></dialog><script>function addSubtaskRow(value=''){let row=document.createElement('div');row.className='subtask-row';row.innerHTML=`<input class="subtask-input" placeholder="عنوان زیرکار" value="${value}"><button type="button" title="حذف زیرکار" onclick="this.parentElement.remove()"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M9 7l1-2h4l1 2m-9 0 1 13h10l1-13"></path></svg></button>`;document.querySelector('#subtask-rows').append(row)}let tpYear=1405,tpMonth=1,tpDate='',tpHour=9,tpMin=0;const pms=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];const pd=n=>String(n).replace(/[0-9]/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]);function taskPicker(){let b=document.querySelector('#task-jalali-picker');let years=Array.from({length:12},(_,i)=>tpYear-5+i).map(y=>`<button type="button" onclick="tpYear=y;taskMonths()">${pd(y)}</button>`).join('');b.innerHTML=`<div class="picker-path"><button class="active">سال ${pd(tpYear)}</button></div><div class="picker-grid picker-years">${years}</div>`;b.hidden=false;document.querySelector('#task-clock-picker').hidden=true}function taskMonths(){let b=document.querySelector('#task-jalali-picker');b.innerHTML=`<div class="picker-path"><button onclick="taskPicker()">سال ${pd(tpYear)}</button><i>‹</i><button class="active">ماه</button></div><div class="picker-grid picker-months">${pms.map((m,i)=>`<button type="button" onclick="tpMonth=${i+1};taskDays()"><small>${pd(i+1)}</small>${m}</button>`).join('')}</div>`}function taskDays(){let b=document.querySelector('#task-jalali-picker');b.innerHTML=`<div class="picker-path"><button class="active">روز</button></div><div class="picker-grid picker-days">${Array.from({length:31},(_,i)=>`<button type="button" onclick="setTaskDate(${i+1})"><b>${pd(i+1)}</b></button>`).join('')}</div>`}function setTaskDate(d){tpDate=`${tpYear}/${String(tpMonth).padStart(2,'0')}/${String(d).padStart(2,'0')}`;let g=new Date(tpYear+621,2,15);for(let i=0;i<410;i++){let q=new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(g),o={};q.forEach(x=>{if(['year','month','day'].includes(x.type))o[x.type]=+x.value});if(o.year===tpYear&&o.month===tpMonth&&o.day===d)break;g.setDate(g.getDate()+1)}document.querySelector('#task-due-date').value=`${g.getFullYear()}-${String(g.getMonth()+1).padStart(2,'0')}-${String(g.getDate()).padStart(2,'0')}`;document.querySelector('#task-date-label').textContent=tpDate;document.querySelector('#task-jalali-picker').hidden=true}function taskClock(){let b=document.querySelector('#task-clock-picker');b.innerHTML=`<div class="analog-head"><span>انتخاب زمان</span></div><div class="time-grid">${Array.from({length:24},(_,h)=>`<button type="button" onclick="setTaskTime(${h})">${pd(h)}:۰۰</button>`).join('')}</div>`;b.hidden=false;document.querySelector('#task-jalali-picker').hidden=true}function setTaskTime(h){document.querySelector('#task-due-time').value=String(h).padStart(2,'0')+':00';document.querySelector('#task-time-label').textContent=pd(h)+':۰۰';document.querySelector('#task-clock-picker').hidden=true}document.querySelector('#open-task-date-picker').onclick=taskPicker;document.querySelector('#open-task-time-picker').onclick=taskClock;document.querySelector('#task-form')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,dueDate=document.querySelector('#task-due-date').value,dueTime=document.querySelector('#task-due-time').value;f.due.value=dueDate?(dueDate+'T'+(dueTime||'23:59')):'';let x=await api('/api/tasks/create/',{title:f.title.value,description:f.description.value,project_id:f.project.value||null,due_date:f.due.value||null,tags:[],subtasks:[...document.querySelectorAll('.subtask-input')].map(x=>x.value.trim()).filter(Boolean),task_type:f.type.value,x:window.taskCreatePosition?.x,y:window.taskCreatePosition?.y});if(x.ok)location.reload()})</script>
