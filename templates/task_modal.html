<dialog id="task-modal"><form id="task-form" class="modal"><div class="title"><h2>وظیفه جدید</h2><button type="button" class="secondary" onclick="this.closest('dialog').close()">×</button></div><input name="title" placeholder="عنوان وظیفه" required><textarea name="description" placeholder="توضیحات"></textarea><select name="project"><option value="">— شخصی —</option>{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input type="datetime-local" name="due"><label><input type="checkbox" name="reminder"> یادآوری</label><input name="tags" placeholder="برچسب‌ها با کاما جدا شوند"><input name="subtasks" placeholder="زیرکارها با کاما جدا شوند"><select name="type"><option value="normal">وظیفه عادی</option><option value="goal">گره هدف</option></select><button>ایجاد وظیفه</button></form></dialog><script>document.querySelector('#task-form')?.addEventListener('submit',async e=>{e.preventDefault();let f=e.target;let x=await api('/api/tasks/create/',{title:f.title.value,description:f.description.value,project_id:f.project.value||null,due_date:f.due.value||null,reminder_enabled:f.reminder.checked,tags:f.tags.value.split(',').map(x=>x.trim()).filter(Boolean),subtasks:f.subtasks.value.split(',').map(x=>x.trim()).filter(Boolean),task_type:f.type.value});if(x.ok)location.reload()})</script>
